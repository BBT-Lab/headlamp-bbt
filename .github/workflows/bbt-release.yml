# 文件描述：构建Headlamp BBT镜像并发布经GitOps同步的版本。
# 项目名称：Headlamp BBT
# 文件名称：bbt-release.yml
# 作者：Codex
# 日期：2026-11-14
name: Headlamp BBT Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如0.0.1'
        required: true
        type: string

concurrency:
  group: headlamp-bbt-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.repository == 'BBT-Lab/headlamp-bbt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/bbt-lab/headlamp-bbt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 生成BBT版本
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '版本号须采用MAJOR.MINOR.PATCH格式'
            exit 1
          fi
          tag="v${VERSION}-bbt-$(TZ=Asia/Hong_Kong date +%y%m%d%H%M)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          jq -n --arg version "$tag" '{product: {productName: "Headlamp BBT", version: $version}}' > app/bbt-build-manifest.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/BBT-Lab/headlamp-bbt
          build-args: |
            HEADLAMP_SOURCE_COMMIT=${{ github.sha }}
            HEADLAMP_BUILD_MANIFEST=bbt-build-manifest.json
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 发布版本和部署清单
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          helm template headlamp charts/headlamp --namespace headlamp \
            -f deploy/web/values.yaml --set-string "image.tag=$TAG@$DIGEST" > headlamp.yaml
          printf 'Headlamp BBT %s\n\n容器镜像：%s:%s@%s\n' "$TAG" "$IMAGE" "$TAG" "$DIGEST" > release-notes.md
          gh release create "$TAG" headlamp.yaml --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md
