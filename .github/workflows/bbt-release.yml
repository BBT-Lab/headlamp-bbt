# 文件描述：构建Headlamp BBT网页镜像和桌面客户端并发布同一版本。
# 项目名称：Headlamp BBT
# 文件名称：bbt-release.yml
# 作者：Codex
# 日期：2026-11-14
name: Headlamp BBT Release
on:
  workflow_dispatch:

concurrency:
  group: headlamp-bbt-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    if: github.repository == 'BBT-Lab/headlamp-bbt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 生成BBT版本
        id: version
        run: |
          node --test .github/scripts/bbt-release-tag.test.mjs
          tag="$(node .github/scripts/bbt-release-tag.mjs)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  web:
    needs: version
    runs-on: ubuntu-latest
    env:
      IMAGE: harbor.bbt.sspu.edu.cn/sspu/headlamp-bbt
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置网页版本
        run: |
          tag="$TAG"
          jq -n --arg version "$tag" '{product: {productName: "Headlamp BBT", version: $version}}' > app/bbt-build-manifest.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          outputs: type=oci,dest=headlamp-image.oci.tar
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: org.opencontainers.image.source=https://github.com/BBT-Lab/headlamp-bbt
          build-args: |
            HEADLAMP_SOURCE_COMMIT=${{ github.sha }}
            HEADLAMP_BUILD_MANIFEST=bbt-build-manifest.json
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 生成部署清单
        run: |
          DIGEST=$(tar -xOf headlamp-image.oci.tar index.json | jq -er \
            '.manifests | select(length == 1) | .[0].digest')
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ $(stat -c%s headlamp-image.oci.tar) -lt 2147483648 ]]
          printf '%s\n' "$DIGEST" > headlamp-image.digest
          helm template headlamp charts/headlamp --namespace headlamp \
            -f deploy/web/values.yaml -f deploy/web/sso-values.yaml \
            --set-string "image.tag=$TAG@$DIGEST" > headlamp.yaml
          cp deploy/web/kustomization.yaml .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bbt-web
          path: |
            headlamp.yaml
            kustomization.yaml
            headlamp-image.oci.tar
            headlamp-image.digest
          compression-level: 0
          if-no-files-found: error

  desktop-prepare:
    needs: version
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            frontend/package-lock.json
            plugins/bbt/*/package-lock.json
      - name: 构建桌面网页和随附插件
        run: |
          node .github/scripts/bbt-desktop-manifest.mjs "$TAG"
          export HEADLAMP_BUILD_MANIFEST="$GITHUB_WORKSPACE/app/bbt-build-manifest.json"
          make app-prepare
          npm run bbt:plugins:install
          npm run bbt:plugins:build
          node .github/scripts/bbt-desktop-manifest.mjs "$TAG" --verify-plugins
          tar -czf bbt-desktop-inputs.tar.gz frontend/build .plugins app/bbt-build-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bbt-desktop-inputs
          path: bbt-desktop-inputs.tar.gz
          compression-level: 0
          if-no-files-found: error

  desktop:
    needs: [version, desktop-prepare]
    name: 桌面客户端 ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win-x64, runner: windows-2022, args: '--win --x64' }
          - { target: win-arm64, runner: windows-11-arm, args: '--win --arm64' }
          - { target: mac, runner: macos-latest, args: '--mac --x64 --arm64 --config.mac.identity=-' }
          - { target: linux, runner: ubuntu-latest, args: '--linux' }
    env:
      TAG: ${{ needs.version.outputs.tag }}
      PACKAGE_ARGS: ${{ matrix.args }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: 安装Windows构建工具
        if: runner.os == 'Windows'
        uses: crazy-max/ghaction-chocolatey@dfdcf5bba9c0a16358a21c13a06ec5c89024b3ac # v4.1.0
        with:
          args: install make
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bbt-desktop-inputs
      - name: 打包桌面客户端
        shell: bash
        run: |
          tar -xzf bbt-desktop-inputs.tar.gz
          export HEADLAMP_BUILD_MANIFEST="$GITHUB_WORKSPACE/app/bbt-build-manifest.json"
          export APP_VERSION="$TAG" APP_NAME="Headlamp BBT"
          build_version="${TAG#v}"
          build_version="${build_version%%.bbt.*}"
          npm --prefix app ci
          read -r -a target_args <<< "$PACKAGE_ARGS"
          npm --prefix app run package -- "${target_args[@]}" "--config.buildVersion=$build_version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bbt-client-${{ matrix.target }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.AppImage
            app/dist/*.tar.gz
            app/dist/*.deb
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [version, web, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
      IMAGE: harbor.bbt.sspu.edu.cn/sspu/headlamp-bbt
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bbt-web
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bbt-client-*
          path: release
          merge-multiple: true
      - name: 同时发布网页和客户端
        working-directory: release
        run: |
          digest="$(cat headlamp-image.digest)"
          printf 'Headlamp BBT %s\n\n容器镜像：%s:%s@%s\n\n桌面客户端包含 Windows、macOS 和 Linux 安装包；Windows 安装包未使用发布证书签名，macOS 安装包未经公证。\n' \
            "$TAG" "$IMAGE" "$TAG" "$digest" > "$RUNNER_TEMP/bbt-release-notes.md"
          gh release create "$TAG" ./* \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/bbt-release-notes.md"
