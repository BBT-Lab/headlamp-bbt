# 文件描述：定期同步GitHub仓库和Release到GitLab。
# 项目名称：Headlamp BBT
# 文件名称：cronjob.yaml
# 作者：Codex
# 日期：2026-11-14
apiVersion: batch/v1
kind: CronJob
metadata:
  name: headlamp-repository-sync
spec:
  schedule: '*/15 * * * *'
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          initContainers:
            - name: prepare
              image: &pythonImage harbor.bbt.sspu.edu.cn/dockerhub/library/python@sha256:cad37dd20c7cac861af9003af8796d03ea7a998ec1e3a664429740fc9d7d2691
              command: ['python', '/app/sync.py', 'prepare']
              env:
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: headlamp-sync-credentials
                      key: github-token
                - &gitlabToken
                  name: GITLAB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: headlamp-sync-credentials
                      key: gitlab-token
                - &noProxy
                  name: NO_PROXY
                  value: .bbt.sspu.edu.cn,localhost,127.0.0.1
              resources: &pythonResources
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: '1'
                  memory: 1Gi
              volumeMounts:
                - &code
                  name: code
                  mountPath: /app
                  readOnly: true
                - name: data
                  mountPath: /data
                - &work
                  name: work
                  mountPath: /work
                - &harborCA
                  name: harbor-ca
                  mountPath: /registry-certs
                  readOnly: true
            - name: import-image
              image: harbor.bbt.sspu.edu.cn/quay/skopeo/stable@sha256:9fdeeda2801cf93a0a15bfb2154e44a0c5a0f3650e54586165bd1b732e503702
              command: ['/bin/bash', '/app/import-image.sh']
              env:
                - *noProxy
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: '1'
                  memory: 1Gi
              volumeMounts:
                - *code
                - *work
                - name: harbor-auth
                  mountPath: /registry-auth
                  readOnly: true
                - *harborCA
          containers:
            - name: sync
              image: *pythonImage
              command: ['python', '/app/sync.py', 'publish']
              env:
                - *gitlabToken
                - *noProxy
              resources: *pythonResources
              volumeMounts:
                - *code
                - *work
                - *harborCA
          volumes:
            - name: code
              configMap:
                name: headlamp-repository-sync
            - name: data
              persistentVolumeClaim:
                claimName: headlamp-sync-data
            - name: work
              emptyDir:
                sizeLimit: 5Gi
            - name: harbor-auth
              secret:
                secretName: headlamp-harbor-push
                optional: true
                items:
                  - key: .dockerconfigjson
                    path: auth.json
            - name: harbor-ca
              configMap:
                name: bbt-root-ca
                items:
                  - key: roots.pem
                    path: ca.crt
